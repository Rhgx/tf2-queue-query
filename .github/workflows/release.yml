name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix"
        required: true

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve repository toolchain
        run: rustup show
      - name: Verify
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = "${{ inputs.version }}"
          }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Package
        shell: pwsh
        run: .\scripts\package-release.ps1 -Version "${{ steps.version.outputs.value }}"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tf2-queue-query-windows-x86_64
          path: |
            dist/*.zip
            dist/*.sha256
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.zip dist/*.sha256 `
            --verify-tag `
            --draft `
            --title "TF2 Queue Query ${{ github.ref_name }}" `
            --generate-notes

  linux-x64:
    needs: windows-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve repository toolchain
        run: rustup show
      - name: Verify
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${{ github.ref_name }}"
            version="${version#v}"
          else
            version="${{ inputs.version }}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          set -euo pipefail
          pkg="tf2-queue-query-v${{ steps.version.outputs.value }}-linux-x86_64"
          mkdir -p "dist/$pkg"
          cp target/release/tf2-queue-query "dist/$pkg/"
          cp README.md LICENSE CHANGELOG.md "dist/$pkg/"
          tar -C dist -czf "dist/$pkg.tar.gz" "$pkg"
          sha256sum "dist/$pkg.tar.gz" > "dist/$pkg.tar.gz.sha256"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tf2-queue-query-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
      - name: Attach to GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" dist/*.tar.gz dist/*.sha256 --clobber
