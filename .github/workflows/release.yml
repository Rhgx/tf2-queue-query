name: Release

# The version comes from Cargo.toml. A tag push must match it (v0.2.0 for 0.2.0) and
# publishes a draft release; a manual run only builds the archives as artifacts.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve repository toolchain
        run: rustup show
      - name: Verify
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match Cargo.toml version $version"
          }
          $package = "tf2-queue-query-v$version-windows-x86_64"
          New-Item -ItemType Directory -Path "dist/$package" | Out-Null
          Copy-Item target/release/tf2-queue-query.exe, README.md, LICENSE, CHANGELOG.md "dist/$package"
          Copy-Item docs "dist/$package/docs" -Recurse
          Push-Location dist
          7z a -tzip "$package.zip" $package | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z failed with exit code $LASTEXITCODE" }
          $hash = (Get-FileHash "$package.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          # LF line ending so `sha256sum -c` accepts the file too.
          [IO.File]::WriteAllText("$PWD/$package.zip.sha256", "$hash  $package.zip`n")
          Pop-Location
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tf2-queue-query-windows-x86_64
          path: |
            dist/*.zip
            dist/*.sha256
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.zip dist/*.sha256 `
            --verify-tag `
            --draft `
            --title "TF2 Queue Query ${{ github.ref_name }}" `
            --generate-notes

  linux-x64:
    # Attaches to the draft release the Windows job creates.
    needs: windows-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve repository toolchain
        run: rustup show
      - name: Verify
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "v$version" ]; then
            echo "Tag ${{ github.ref_name }} does not match Cargo.toml version $version" >&2
            exit 1
          fi
          package="tf2-queue-query-v$version-linux-x86_64"
          mkdir -p "dist/$package"
          cp target/release/tf2-queue-query README.md LICENSE CHANGELOG.md "dist/$package/"
          cp -r docs "dist/$package/"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          (cd dist && sha256sum "$package.tar.gz" > "$package.tar.gz.sha256")
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tf2-queue-query-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
      - name: Attach to GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" dist/*.tar.gz dist/*.sha256 --clobber
